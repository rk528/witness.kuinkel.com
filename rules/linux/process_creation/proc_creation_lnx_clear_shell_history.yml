title: Shell History File Deleted or Emptied
id: b7898949-af09-4726-a843-8ef0433040de
status: experimental
description: |
  Detects rm, shred, truncate or ln being pointed at a shell history file. Wiping
  .bash_history or linking it to /dev/null is how intruders hide the commands they ran.
  Reading the file (cat, less, grep) is ignored, so analysts reviewing history stay quiet.
references:
  - https://attack.mitre.org/techniques/T1070/003/
author: Raghav Kuinkel
date: 2026-10-24
tags:
  - attack.defense-evasion
  - attack.t1070.003
logsource:
  product: linux
  category: process_creation
detection:
  selection_img:
    Image|endswith:
      - '/rm'
      - '/shred'
      - '/truncate'
      - '/ln'
  selection_file:
    CommandLine|contains:
      - '.bash_history'
      - '.zsh_history'
      - '.sh_history'
      - '.history'
  condition: all of selection_*
falsepositives:
  - Users deliberately clearing their own history. Rare on servers and worth asking about.
level: medium
