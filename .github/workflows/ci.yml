name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Unit tests and evidence tests
        run: python -m pytest -q
      - name: Every rule against its evidence
        run: python -m witness test
      - name: Committed queries and site match the rules
        run: python -m witness build --check
